[package]
name = "fusiontunx"
version = "1.0.3"
edition = "2021"
description = "FusionTunX - Mihomo Controller and Tunneling Manager"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
base64 = "0.22"
url = "2.5"
flate2 = "1.0"
tar = "0.4"
chrono = "0.4"
libc = "0.2"
mime_guess = "2.0"
rust-embed = { version = "8.5", features = ["mime-guess"] }
futures-util = "0.3"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
